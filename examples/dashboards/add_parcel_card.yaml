# Add a Nova Post parcel straight from a dashboard — no diving into the options.
#
# The integration exposes two services:
#   - nova_post.track_parcel   (tracking_code)
#   - nova_post.untrack_parcel (tracking_code)
#
# This example wires a text field + a button on a Lovelace card to
# nova_post.track_parcel. It needs one helper and one script (below), then the card.

# ---------------------------------------------------------------------------
# 1) Helper — Settings → Devices & Services → Helpers → Create → Text,
#    or in configuration.yaml:
# ---------------------------------------------------------------------------
input_text:
  # A TTN is 14 digits, but max is generous enough to allow pasting one
  # with spaces/dashes still in it — the service strips those before
  # validating (see custom_components/nova_post/config_flow.py).
  nova_post_new_parcel:
    name: New Nova Post tracking number (TTN)
    max: 20

# ---------------------------------------------------------------------------
# 2) Script — reads the text field, tracks the parcel, then clears the field.
#    Add to scripts.yaml (or Settings → Automations & Scenes → Scripts).
# ---------------------------------------------------------------------------
nova_post_track_new_parcel:
  alias: "Nova Post: track the parcel in the input box"
  sequence:
    - condition: template
      value_template: "{{ states('input_text.nova_post_new_parcel') | trim != '' }}"
    - action: nova_post.track_parcel
      data:
        tracking_code: "{{ states('input_text.nova_post_new_parcel') | trim }}"
        
        
    - action: input_text.set_value
      target:
        entity_id: input_text.nova_post_new_parcel
      data:
        value: ""

# ---------------------------------------------------------------------------
# 3) Lovelace card — paste into a dashboard (Edit → raw config, or add a
#    manual card). Type the number, press the button.
# ---------------------------------------------------------------------------
